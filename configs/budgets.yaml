# Budgets (PLAN.md §11). Must be committed before Phase C (sensitivity + solver).
# Memory in GiB. R_max is evaluated at `context_tokens`.
r_max_gib: null          # team value: fill in before Phase C
s_min_tokens_per_s: null # optional decode-speed floor; null = off
context_tokens: 4096
kv_cache_type: f16

# Pre-registered budget-map grid.
budget_map_r_max_gib: [3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5]

# Runtime overhead (compute buffers + process baseline), GiB, per model.
# Placeholder estimates until measured on the Pi (PLAN.md §9 row 2); replace with measurements.
overhead_gib:
  default: 0.40
overhead_is_measured: false
