# Web text: FineWeb-Edu documents are hashed into four disjoint shards A-D; each split takes whole
# documents from its shard, in hash order, until it reaches its token target (Qwen tokenizer).
web_text:
  min_doc_tokens: 128
  max_doc_tokens: 8192
  tokens:
    calibration: 300000   # shard A: llama-imatrix (-c 512 -> ~585 chunks), Stage-2 quantizer
    sensitivity: 100000   # shard B: per-gene KL penalties
    selection: 150000     # shard C: refinement, shortlist
    test: 150000          # shard D: with WikiText-2 test (~290k tokens) gives >= 300k test tokens

# Task items. Test = full official sets (PLAN.md §2.1). Selection = items from non-test splits,
# sampled by seed. Few-shot exemplars come from splits used by neither.
tasks:
  test:
    hellaswag: validation        # 10,042
    winogrande: validation       # 1,267 (winogrande_xl dev)
    arc_challenge: test          # 1,172
    mmlu: test                   # 14,042
    gsm8k: test                  # 1,319
  selection:
    hellaswag: {split: train, n: 1000}
    winogrande: {split: train, n: 1000}
    arc_challenge: {split: [train, validation], n: 1000}
    mmlu: {split: validation, n: all}   # 1,531
    gsm8k: {split: train, n: 500}
  fewshot:
    mmlu: dev                    # the standard 5 per subject
    gsm8k: {split: train, n: 5}  # disjoint from the gsm8k selection sample
