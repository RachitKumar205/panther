# Data sources and split sizes (PLAN.md §3). Revisions are Hugging Face dataset commit SHAs.
seed: 20261110
tokenizer_model: Qwen2.5-1.5B-Instruct   # all Qwen2.5 sizes share this tokenizer

sources:
  fineweb_edu:
    repo: HuggingFaceFW/fineweb-edu
    revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
    files: [sample/10BT/000_00000.parquet]
  wikitext:
    repo: Salesforce/wikitext
    revision: b08601e04326c79dfdd32d625aee71d232d685c3
    files: [wikitext-2-raw-v1/test-00000-of-00001.parquet]
  hellaswag:
    repo: Rowan/hellaswag
    revision: 218ec52e09a7e7462a5400043bb9a69a41d06b76
    files: [data/train-00000-of-00001.parquet, data/validation-00000-of-00001.parquet]
  winogrande:
    repo: allenai/winogrande
    revision: 01e74176c63542e6b0bcb004dcdea22d94fb67b5
    files: [winogrande_xl/train-00000-of-00001.parquet, winogrande_xl/validation-00000-of-00001.parquet]
  arc_challenge:
    repo: allenai/ai2_arc
