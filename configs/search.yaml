# Settings for the pipeline (scripts/server/README.md). Byte sizes always come from gguf-py; nothing here restates them.

# RAM model: total RAM on the Pi = weights + KV cache + runtime overhead, at `context_tokens`.
context_tokens: 4096
kv_cache_type: Q8_0
overhead_gib: 0.40            # placeholder until the Pi measures it

# Budgets and the models searched at each (`reference` models are not used by the current pipeline).
contests:
  1: {searched: [Qwen2.5-1.5B-Instruct], reference: []}
  3: {searched: [Qwen2.5-7B-Instruct], reference: [Qwen2.5-3B-Instruct]}
  5: {searched: [Qwen2.5-14B-Instruct, Qwen2.5-7B-Instruct, InternLM2.5-20B-Chat], reference: []}
  7: {searched: [Qwen2.5-14B-Instruct, Qwen2.5-32B-Instruct, InternLM2.5-20B-Chat, Mistral-24B-Instruct], reference: [Qwen2.5-7B-Instruct]}

# Quantization types. A model's list for a budget is those from 1.5 bits/weight below to 2.5 above the average the
# budget allows. Types that need importance-matrix data are never used where there is none (token embedding; the
# output layer unless configs/models.yaml sets imatrix_process_output).
formats: [IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS, IQ2_S, Q2_K, IQ3_XXS, Q3_K, IQ3_S, IQ4_XS, Q4_K, Q5_K, Q6_K, Q8_0]
requires_imatrix: [IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS]
