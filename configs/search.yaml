# Pipeline settings. Byte sizes always come from gguf; nothing here restates them.

# RAM model: weights + KV cache + runtime overhead, at `context_tokens`.
context_tokens: 4096
kv_cache_type: Q8_0
overhead_gib: 0.40

# Budgets and the models searched at each.
contests:
  1: {searched: [Qwen2.5-1.5B-Instruct]}
  3: {searched: [Qwen2.5-7B-Instruct]}
  5: {searched: [Qwen2.5-14B-Instruct, Qwen2.5-7B-Instruct, Mistral-22B-Instruct]}
  7: {searched: [Qwen2.5-14B-Instruct, Mistral-22B-Instruct, Mistral-24B-Instruct]}

# Quantization types a matrix may take, and those needing importance-matrix data
# (never used for the token embedding, or the output layer without imatrix_process_output).
formats: [IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS, IQ2_S, Q2_K, IQ3_XXS, Q3_K, IQ3_S, IQ4_XS, Q4_K, Q5_K, Q6_K, Q8_0]
requires_imatrix: [IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS]
