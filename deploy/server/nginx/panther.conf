# Panther dashboard, HTTPS. Read-only and public: GET and HEAD only, per-address request and connection limits
# (the live log holds a connection open, so it gets its own small limit). The dashboard runs rootless and listens
# only on the address this proxy reaches it at (@UPSTREAM@), not on the LAN.
# Rendered by deploy/server/proxy-setup.sh into /etc/nginx/conf.d/ (@DOMAIN@, @UPSTREAM@ from local.env).

limit_req_zone  $binary_remote_addr zone=panther_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=panther_conn:10m;
log_format panther_meta '$remote_addr [$time_iso8601] $host "$request_method $uri" $status $body_bytes_sent rt=$request_time';
map $status $panther_log_it { ~^[45] 1; default 0; }

server {
    listen 443 ssl;
    server_name @DOMAIN@;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/panther/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panther/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:PANTHERSSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/access.log panther_meta if=$panther_log_it;
    client_max_body_size 1k;
    limit_req  zone=panther_req burst=40 nodelay;
    limit_conn panther_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;

    location = /api/logs/stream {
        limit_except GET { deny all; }
        limit_conn panther_conn 2;
        proxy_pass http://@UPSTREAM@;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://@UPSTREAM@;
        proxy_read_timeout 30s;
    }
}
