# Panther dashboard, port 80: ACME challenges for its certificate, everything else -> HTTPS.
# Rendered by deploy/server/proxy-setup.sh into /etc/nginx/conf.d/ (@DOMAIN@ from local.env).
server {
    listen 80;
    server_name @DOMAIN@;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
