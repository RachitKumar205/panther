[project]
name = "panther"
version = "0.1.0"
description = "Best model and mixed-precision configuration within a RAM budget on a Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
    "gguf>=0.17",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "ortools>=9.10",
]

[project.optional-dependencies]
# Installed on the server only (quality evaluation, data preparation, Stage 2 quantizer).
server = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",  # transformers needs it to load GGUF files (distillation)
    "sentencepiece>=0.2",  # InternLM's tokenizer
    "datasets>=3.0",
    "lm-eval>=0.4.5",
    "pyarrow>=16",
    "huggingface_hub[cli]>=0.34",
]

# On Linux (the server image), torch must be the CUDA 12.9 build, matching the image's CUDA toolkit
# (deploy/server/Containerfile: nvidia/cuda:12.9.1-devel-ubi9). PyPI's default Linux wheel targets a newer
# CUDA. The cu129 index's newest torch is 2.13.0. The Mac keeps the PyPI (CPU/MPS) wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
