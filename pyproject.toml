[project]
name = "panther"
version = "0.2.0"
description = "A llama.cpp file per (model, RAM budget) that loses less than llama.cpp's best preset that fits"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "gguf>=0.17",
    "pyyaml>=6.0",
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
    "huggingface_hub>=0.34",
    "psutil>=5.9",
    "ortools>=9.10",
    "pyarrow>=16",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
