[project]
name = "panther"
version = "0.1.0"
description = "Best model and mixed-precision configuration within a RAM budget on a Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "panther-core",
    "panther-data",
    "panther-measure",
    "panther-quant",
    "panther-search",
    "panther-pipeline",
    "panther-ops",
    "panther-dashboard",
    "panther-cli",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
panther-core = { workspace = true }
panther-data = { workspace = true }
panther-measure = { workspace = true }
panther-quant = { workspace = true }
panther-search = { workspace = true }
panther-pipeline = { workspace = true }
panther-ops = { workspace = true }
panther-dashboard = { workspace = true }
panther-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["panther-old", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "panther_core",
    "panther_data",
    "panther_measure",
    "panther_quant",
    "panther_search",
    "panther_pipeline",
    "panther_ops",
    "panther_dashboard",
    "panther_cli",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages", "apps"]
exclude = ["**/__pycache__", ".venv", "panther-old"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU and a real llama.cpp build",
    "network: needs network access (Hugging Face)",
    "slow: long-running end-to-end smoke test",
]

[tool.coverage.run]
branch = true
source = [
    "panther_core",
    "panther_data",
    "panther_measure",
    "panther_quant",
    "panther_search",
    "panther_pipeline",
    "panther_ops",
    "panther_dashboard",
    "panther_cli",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
include_external_packages = true
root_packages = [
    "panther_core",
    "panther_data",
    "panther_measure",
    "panther_quant",
    "panther_search",
    "panther_pipeline",
    "panther_ops",
    "panther_dashboard",
    "panther_cli",
]

[[tool.importlinter.contracts]]
name = "panther-core has no heavy or upward dependencies"
type = "forbidden"
source_modules = ["panther_core"]
forbidden_modules = [
    "torch",
    "transformers",
    "huggingface_hub",
    "ortools",
    "typer",
    "rich",
    "panther_data",
    "panther_measure",
    "panther_quant",
    "panther_search",
    "panther_pipeline",
    "panther_ops",
    "panther_dashboard",
    "panther_cli",
]
