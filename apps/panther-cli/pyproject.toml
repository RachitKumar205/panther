[project]
name = "panther-cli"
version = "0.1.0"
description = "The `panther` command-line entry point."
requires-python = ">=3.12,<3.13"
dependencies = ["panther-ops", "panther-pipeline", "typer>=0.12", "rich>=13"]

[project.scripts]
panther = "panther_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther_cli"]
