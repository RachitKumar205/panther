[project]
name = "panther-measure"
version = "0.1.0"
description = "llama.cpp backends, output parsers and the measurement result cache."
requires-python = ">=3.12,<3.13"
dependencies = ["panther-core", "panther-data", "numpy>=1.26", "gguf>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther_measure"]
