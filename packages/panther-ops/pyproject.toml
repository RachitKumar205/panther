[project]
name = "panther-ops"
version = "0.1.0"
description = "Container runtime, resource claims, locks and the GitLab guard."
requires-python = ">=3.12,<3.13"
dependencies = ["panther-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther_ops"]
