[project]
name = "panther-data"
version = "0.1.0"
description = "Dataset splits, prompt building, config schemas and integrity checks."
requires-python = ">=3.12,<3.13"
dependencies = ["panther-core", "pydantic>=2.9", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther_data"]
