[project]
name = "panther-core"
version = "0.1.0"
description = "Pure domain model: geometry, RAM accounting, genomes, scoring and statistics."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "gguf>=0.17", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther_core"]
