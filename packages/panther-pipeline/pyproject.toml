[project]
name = "panther-pipeline"
version = "0.1.0"
description = "Pipeline step graph, final selection, guard, verdict and bundle."
requires-python = ">=3.12,<3.13"
dependencies = [
    "panther-core",
    "panther-data",
    "panther-measure",
    "panther-quant",
    "panther-search",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panther_pipeline"]
