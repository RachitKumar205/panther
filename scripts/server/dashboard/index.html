<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panther</title>
<link rel="preload" href="recursive.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23c2410c'/%3E%3Cpath d='M4 12V4h5a2.5 2.5 0 0 1 0 5H4' stroke='white' stroke-width='1.8' fill='none'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem("panther-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="app">
  <nav class="side" id="side">
    <a class="brand" href="#/"><span class="logo">P</span><b>Panther</b></a>
    <div class="navgroup">
      <a href="#/" data-nav="overview"><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v3H9zM9 7h5v7H9zM2 9h5v5H2z"/></svg>Overview</a>
      <a href="#/contests" data-nav="contests"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 8h12M2 13h12"/><circle cx="5" cy="3" r="1.4"/><circle cx="10" cy="8" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg>Contests<span class="cnt" id="cnt-con"></span></a>
      <a href="#/experiments" data-nav="experiments"><svg viewBox="0 0 16 16"><path d="M6 2v4L2.5 13a1 1 0 0 0 .9 1.4h9.2a1 1 0 0 0 .9-1.4L10 6V2M5 2h6M4.5 10h7"/></svg>Experiments<span class="cnt" id="cnt-exp"></span></a>
      <a href="#/system" data-nav="system"><svg viewBox="0 0 16 16"><path d="M2 3h12v7H2zM5 13h6M8 10v3"/></svg>System</a>
      <a href="#/logs" data-nav="logs"><svg viewBox="0 0 16 16"><path d="M3 2h10v12H3zM5.5 5h5M5.5 8h5M5.5 11h3"/></svg>Logs</a>
    </div>
    <div class="sidefoot">
      <button class="btn" id="theme">◐ Theme</button>
      <span class="muted">self-hosted · read-only</span>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="bar">
      <button class="btn menu" id="menu" aria-label="Menu">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="status"><span id="running" class="pill run" hidden></span><span class="mono"><span id="dot" class="dot"></span> <span id="age">…</span></span></div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="page" class="page"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
