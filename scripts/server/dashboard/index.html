<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panther pipeline</title>
<link rel="preload" href="recursive.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23c2410c'/%3E%3Cpath d='M4 12V4h5a2.5 2.5 0 0 1 0 5H4' stroke='white' stroke-width='1.8' fill='none'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem("panther-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <b class="mark">PANTHER</b>
  <span id="headline" class="headline"></span>
  <span class="meta">
    <span id="sys" class="mono muted"></span>
    <span class="mono"><span id="dot" class="dot"></span> <span id="age">connecting…</span></span>
    <button class="btn" id="theme" title="Light / dark">◐</button>
  </span>
</header>
<div id="banner" class="banner" hidden></div>
<main class="wrap">
  <section id="exp" hidden></section>
  <section>
    <h2>Contests <span class="muted">ours − llama.cpp's preset, held-out test, 95% interval</span></h2>
    <div id="contests"></div>
  </section>
  <section>
    <h2>Log <button class="link" id="more">show all</button></h2>
    <ul class="feed" id="feed"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
